name: Build Android APK (CEKAS)

on:
  push:
    branches: [ master, pure-python ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install jinja2 openpyxl matplotlib pillow

      - name: Build Web Bundle with Python
        run: |
          python scripts/build_mobile_bundle.py

      - name: Install Capacitor Locally
        run: |
          npm install --save @capacitor/core@latest @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Copy Icons to Android Res
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi/
          cp cekas_app/static/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp cekas_app/static/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CEKAS-Kas-XI-F2-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
