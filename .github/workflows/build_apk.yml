name: Build Android APK (CEKAS)

on:
  push:
    branches: [ master, pure-python ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Web Distribution for Capacitor
        run: |
          mkdir -p www/static
          cp cekas_app/templates/dashboard.html www/index.html
          cp cekas_app/static/* www/static/
          sed -i 's|/api/export/excel|#|g' www/index.html
          sed -i 's|/api/export/chart|#|g' www/index.html

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init "CEKAS Kas" "id.sch.smakartika.cekas" --web-dir www
          npx cap add android

      - name: Copy Icons to Android Res
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi/
          cp cekas_app/static/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CEKAS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
